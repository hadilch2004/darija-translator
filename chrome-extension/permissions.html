<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Microphone access – Darija Translator</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 12vh auto; padding: 0 1rem; }
    button { font: inherit; padding: .6rem 1.1rem; border-radius: 8px; border: 0; background: #006233; color: #fff; cursor: pointer; }
    #result { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Microphone access</h1>
  <p>Chrome cannot show the microphone prompt inside the side panel, so grant it here once.
     Afterwards the 🎤 <em>Speak</em> button works in the panel.</p>
  <button id="allow" type="button">Allow microphone</button>
  <p id="result" role="status"></p>
  <script src="permissions.js"></script>
</body>
</html>
